    <circle cx="82.5" cy="64" r="1.9" fill="#e6c27a"/>
    <text x="100" y="63" fill="#e9edf5" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="700" letter-spacing="1" style="font-variant: small-caps">PrepKit</text>
    <text x="200" y="63" class="f">v0.1.0</text>
    <path d="M1124 57h12M1166 51h11v11h-11zM1206 51l11 11M1217 51l-11 11" stroke="#a1aabe" stroke-width="1.5" fill="none" stroke-linecap="round"/>
