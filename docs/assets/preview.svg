        <text x="22" y="11" fill="#e9edf5">coin.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
      </g>
      <g transform="translate(868 496)">
        <path d="M0 6l4 4 8-9" stroke="#5fd68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="11" fill="#e9edf5">gem.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
      </g>
      <g transform="translate(868 526)">
        <path d="M0 6l4 4 8-9" stroke="#5fd68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="11" fill="#e9edf5">heart.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
      </g>
      <g transform="translate(868 556)">
        <path d="M0 6l4 4 8-9" stroke="#5fd68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="11" fill="#e9edf5">leaf.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
      </g>
      <g transform="translate(868 586)">
        <path d="M0 6l4 4 8-9" stroke="#5fd68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="11" fill="#e9edf5">star.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
      </g>
      <g transform="translate(868 616)">
        <path d="M0 6l4 4 8-9" stroke="#5fd68a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="22" y="11" fill="#e9edf5">chest.png</text><text x="322" y="11" class="mono f" font-size="12" text-anchor="end">Fixed</text>
