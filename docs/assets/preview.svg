<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="t d">
  <title id="t">PrepKit window</title>
  <desc id="d">The PrepKit window: a folder of sprites in grid view, Pixel Fix options, and results with the Fix button at the bottom.</desc>
  <defs>
    <radialGradient id="gv" cx="0.18" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gt" cx="0.88" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#5fd4c8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5fd4c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
