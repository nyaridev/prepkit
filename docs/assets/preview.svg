      <stop offset="0.5" stop-color="#e6c27a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e6c27a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ck" width="14" height="14" patternUnits="userSpaceOnUse">
