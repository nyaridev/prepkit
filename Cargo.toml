[workspace]
resolver = "2"
members = ["crates/prepkit-core", "crates/prepkit-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nyaridev/prepkit"

[workspace.dependencies]
prepkit-core = { path = "crates/prepkit-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
